<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flag check 🚩💚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main class="app">
    <header class="hero">
      <p class="eyebrow">real talk only</p>
      <h1>flag<span>check</span></h1>
      <p class="tagline">paste the situation. jev tells you if it's 🚩 or 💚</p>
    </header>

    <section class="card input-card">
      <label for="query">spill the tea</label>
      <textarea
        id="query"
        rows="5"
        maxlength="4000"
        placeholder="e.g. he cancelled 3 times last minute but says i'm overreacting..."
      ></textarea>
      <div class="row">
        <span id="char-count" class="char-count">0 / 4000</span>
        <button id="analyze-btn" type="button">
          <span class="btn-label">run the check</span>
          <span class="btn-spark">✦</span>
        </button>
      </div>
    </section>

    <section id="result" class="card result-card hidden" aria-live="polite">
      <div class="result-top">
        <p class="result-eyebrow">the verdict</p>
        <h2 id="result-label" class="result-label">—</h2>
        <p id="result-vibe" class="result-vibe">—</p>
      </div>

      <div class="meter-wrap">
        <div class="meter-labels">
          <span>🚩 red</span>
          <span>💚 green</span>
        </div>
        <div class="meter-track">
          <div class="meter-gradient"></div>
          <div id="meter-fill" class="meter-fill"></div>
          <div id="meter-thumb" class="meter-thumb">▲</div>
        </div>
        <p id="result-percent" class="result-percent">0%</p>
      </div>
    </section>

    <p id="error" class="error hidden" role="alert"></p>
  </main>

  <footer class="footer">
    <span>not therapy • just vibes</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
